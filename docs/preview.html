<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Card – Preview</title>
<style>
  :root {
    --primary-color: #03a9f4;
    --text-primary-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --secondary-background-color: #e5e5e5;
    --card-background-color: #ffffff;
    --divider-color: rgba(0, 0, 0, 0.12);
    --error-color: #db4437;
    --page: #fafafa;
  }
  body.dark {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --secondary-background-color: #282828;
    --card-background-color: #1c1c1c;
    --divider-color: rgba(225, 225, 225, 0.12);
    --page: #111111;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page);
    color: var(--primary-text-color);
    font-family: Roboto, -apple-system, "Segoe UI", sans-serif;
  }
  h2 { font-size: 14px; font-weight: 500; margin: 20px 0 8px; color: var(--secondary-text-color); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .cell { margin: 0 16px 16px 0; }
  .w12 { width: 500px; }
  .w6 { width: 245px; }
  .phone { width: 343px; }
  #log { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--secondary-text-color); max-height: 160px; overflow: auto; }
  .tools button { margin-right: 8px; }
  /* ?readme: only the cards, for docs/preview.png */
  body.readme .tools, body.readme h2, body.readme #log, body.readme #c-missing, body.readme #c-broken { display: none; }
  body.readme { padding: 16px 0 0 16px; }
</style>
</head>
<body>
<div class="tools">
  <button id="theme">Hell/Dunkel</button>
  <button id="nocolormix">color-mix() entfernen</button>
  <button id="nexttrack">Büro: nächster Titel</button>
</div>

<h2>12 Spalten (≈ 500 px)</h2>
<div class="row">
  <div class="cell w12" id="c-playing"></div>
  <div class="cell w12" id="c-paused"></div>
</div>

<h2>Handy (343 px)</h2>
<div class="row">
  <div class="cell phone" id="c-phone"></div>
  <div class="cell phone" id="c-radio"></div>
</div>

<h2>Sonderfälle (6 Spalten ≈ 245 px)</h2>
<div class="row">
  <div class="cell w6" id="c-off"></div>
  <div class="cell w6" id="c-idle"></div>
  <div class="cell w6" id="c-unavailable"></div>
  <div class="cell w6" id="c-missing"></div>
  <div class="cell w6" id="c-broken"></div>
</div>

<h2>Service-Aufrufe</h2>
<div id="log"></div>

<script>
  // Minimal ha-card stand-in
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        "<style>:host{display:block;background:var(--card-background-color);border-radius:12px;" +
        "border:1px solid var(--divider-color);color:var(--primary-text-color)}</style><slot></slot>";
    }
  });

  // Test covers as real PNGs (canvas), so the card can read their colours.
  // edge = colour of the left edge, w/h = image format
  function cover(edge, accent, w, h) {
    const c = document.createElement("canvas");
    c.width = w || 300;
    c.height = h || 300;
    const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, c.width, 0);
    g.addColorStop(0, edge);
    g.addColorStop(1, accent);
    x.fillStyle = g;
    x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = "rgba(255,255,255,.35)";
    x.beginPath(); x.arc(c.width * 0.68, c.height * 0.32, Math.min(c.width, c.height) * 0.22, 0, 7); x.fill();
    x.fillStyle = "rgba(0,0,0,.25)";
    x.beginPath(); x.arc(c.width * 0.62, c.height * 0.78, Math.min(c.width, c.height) * 0.3, 0, 7); x.fill();
    return c.toDataURL("image/png");
  }

  const ALL = 1 | 4 | 8 | 16 | 32 | 128 | 256 | 4096 | 16384;
  const now = () => new Date().toISOString();

  // ?en renders the English interface, default is German
  const LANG = /(^|[?&])en(&|$)/.test(location.search.slice(1)) ? "en" : "de";
  const LABELS = {
    de: { off: "Aus", idle: "Untätig", paused: "Pausiert", playing: "Spielt", unavailable: "Nicht verfügbar", on: "An" },
    en: { off: "Off", idle: "Idle", paused: "Paused", playing: "Playing", unavailable: "Unavailable", on: "On" },
  }[LANG];
  let hass = {
    language: LANG,
    locale: { language: LANG },
    formatEntityState: (s) => LABELS[s.state] || s.state,
    states: {
      "media_player.buro": { entity_id: "media_player.buro", state: "playing", attributes: {
        friendly_name: "Büro", supported_features: ALL, volume_level: 0.35, is_volume_muted: false,
        media_title: "A Very Long Song Title That Needs Two Lines To Fit Into The Card",
        media_artist: "Some Artist", media_album_name: "The Album", app_name: "Spotify",
        media_duration: 247, media_position: 61, media_position_updated_at: now(),
        entity_picture: cover("#7a1f3d", "#ff9f43") } },
      "media_player.kueche": { entity_id: "media_player.kueche", state: "paused", attributes: {
        friendly_name: "Küche", supported_features: ALL, volume_level: 0.6, is_volume_muted: true,
        media_title: "Short Title", media_artist: "Band", source: "AirPlay",
        media_duration: 180, media_position: 90, media_position_updated_at: now(),
        entity_picture: cover("#e8e2c8", "#0abde3", 300, 420) } },
      "media_player.radio": { entity_id: "media_player.radio", state: "playing", attributes: {
        friendly_name: "Wohnzimmer", supported_features: 1 | 4 | 8 | 4096 | 16384, volume_level: 0.2,
        media_title: "Deutschlandfunk", media_artist: "Nachrichten", entity_picture: cover("#1e3799", "#38ada9", 480, 270) } },
      "media_player.broken": { entity_id: "media_player.broken", state: "playing", attributes: {
        friendly_name: "Flur", supported_features: ALL, volume_level: 0.3,
        media_title: "Kein Cover", media_artist: "Defekte Bild-URL", entity_picture: "/broken.png" } },
      "media_player.off": { entity_id: "media_player.off", state: "off", attributes: {
        friendly_name: "Schlafzimmer", supported_features: ALL } },
      "media_player.idle": { entity_id: "media_player.idle", state: "idle", attributes: {
        friendly_name: "Bad", supported_features: ALL, volume_level: 0.5 } },
      "media_player.gone": { entity_id: "media_player.gone", state: "unavailable", attributes: {
        friendly_name: "Garten", supported_features: ALL } },
    },
  };

  const cards = [];
  const log = document.getElementById("log");

  hass.callService = (domain, service, data) => {
    log.textContent = domain + "." + service + " " + JSON.stringify(data) + "\n" + log.textContent;
    // Simulate HA answering after a short delay
    setTimeout(() => {
      const old = hass.states[data.entity_id];
      const s = { ...old, attributes: { ...old.attributes } };
      if (service === "volume_set") s.attributes.volume_level = data.volume_level;
      if (service === "volume_mute") s.attributes.is_volume_muted = data.is_volume_muted;
      if (service === "media_pause") { s.state = "paused"; s.attributes.media_position = 120; s.attributes.media_position_updated_at = now(); }
      if (service === "media_play") { s.state = "playing"; s.attributes.media_position_updated_at = now(); }
      if (service === "media_stop") s.state = "idle";
      if (service === "turn_on") s.state = "idle";
      hass = { ...hass, states: { ...hass.states, [data.entity_id]: s } };
      cards.forEach((c) => { c.hass = hass; });
    }, 250);
    return Promise.resolve();
  };

  function add(id, config) {
    const card = document.createElement("now-playing-card");
    card.setConfig({ type: "custom:now-playing-card", ...config });
    card.hass = hass;
    document.getElementById(id).appendChild(card);
    cards.push(card);
  }

  // Next track on "Büro": new title and a cover with a different edge colour
  const TRACKS = [
    ["Second Song", "Other Artist", "#0b6e4f", "#f8c630", 300, 300],
    ["Third Song", "Pale Cover", "#f1f2f6", "#ff4757", 300, 300],
    ["A Very Long Song Title That Needs Two Lines To Fit Into The Card", "Some Artist", "#7a1f3d", "#ff9f43", 300, 300],
  ];
  let track = 0;
  document.getElementById("nexttrack").onclick = () => {
    const t = TRACKS[track++ % TRACKS.length];
    const old = hass.states["media_player.buro"];
    const st = { ...old, attributes: { ...old.attributes, media_title: t[0], media_artist: t[1],
      media_position: 0, media_position_updated_at: now(), entity_picture: cover(t[2], t[3], t[4], t[5]) } };
    hass = { ...hass, states: { ...hass.states, "media_player.buro": st } };
    cards.forEach((c) => { c.hass = hass; });
  };
  document.getElementById("theme").onclick = () => document.body.classList.toggle("dark");
  document.getElementById("nocolormix").onclick = () => {
    cards.forEach((c) => {
      const st = c.shadowRoot.querySelector("style");
      if (st) st.textContent = st.textContent.replace(/^.*color-mix\(.*$/gm, "");
    });
  };
  document.addEventListener("hass-more-info", (e) => {
    log.textContent = "more-info " + e.detail.entityId + "\n" + log.textContent;
  });
</script>
<script src="../dist/now-playing-card.js"></script>
<script>
  if (/readme/.test(location.search)) document.body.classList.add("readme");
  if (/dark/.test(location.search)) document.body.classList.add("dark");
  add("c-playing", { entity: "media_player.buro" });
  add("c-paused", { entity: "media_player.kueche" });
  add("c-phone", { entity: "media_player.buro" });
  add("c-radio", { entity: "media_player.radio" });
  add("c-off", { entity: "media_player.off" });
  add("c-idle", { entity: "media_player.idle", name: "Badezimmer" });
  add("c-unavailable", { entity: "media_player.gone" });
  add("c-missing", { entity: "media_player.nope" });
  add("c-broken", { entity: "media_player.broken" });
</script>
</body>
</html>
